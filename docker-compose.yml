services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hirepilot
      POSTGRES_USER: hirepilot
      POSTGRES_PASSWORD: hirepilot
    ports: ["5433:5432"]
    volumes: ["hirepilot-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirepilot"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hirepilot
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  hirepilot-pg: