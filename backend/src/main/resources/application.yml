spring:
  application.name: hirepilot-backend
  datasource:
    url: jdbc:h2:mem:hirepilot;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
server:
  port: 8080
---
spring:
  config.activate.on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hirepilot}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:hirepilot}
    password: ${SPRING_DATASOURCE_PASSWORD:hirepilot}