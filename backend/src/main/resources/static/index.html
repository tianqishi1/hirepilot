<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HirePilot · AI 招聘运营台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">HirePilot<span>AI 招聘运营台</span></div>
  <div class="header-right">
    <span id="worker-dot" class="dot off" title="Worker 状态"></span><span id="worker-text" class="muted">Worker 离线</span>
    <select id="job-select"></select>
    <button class="btn ghost" id="btn-new-job">＋ 新职位</button>
    <button class="btn red" id="btn-reset" title="清空本职位全部数据（开发用）">重置</button>
    <button class="btn primary" id="btn-screen">筛选简历</button>
    <button class="btn primary" id="btn-engage">执行触达与回复</button>
  </div>
</header>
<div id="run-banner" class="banner hidden">Agent 正在执行…<span class="spinner"></span></div>
<main>
  <section id="funnel" class="funnel"></section>
  <nav class="tabs">
    <button class="tab active" data-tab="reviews">审核队列 <span id="review-count" class="pill">0</span></button>
    <button class="tab" data-tab="candidates">候选人</button>
    <button class="tab" data-tab="runs">运行记录</button>
  </nav>
  <section id="tab-reviews" class="tabpane"></section>
  <section id="tab-candidates" class="tabpane hidden"></section>
  <section id="tab-runs" class="tabpane hidden"></section>
</main>

<div id="modal-job" class="modal hidden">
  <div class="modal-box">
    <h3>新建职位</h3>
    <label>职位名称<input id="j-title" placeholder="如：资深Java工程师（远程）"></label>
    <label>JD 描述<textarea id="j-jd" rows="3" placeholder="岗位职责与要求"></textarea></label>
    <div class="row3">
      <label>最低年限<input id="j-years" type="number" value="3"></label>
      <label>最低学历<select id="j-degree"><option>本科</option><option>大专</option><option>硕士</option><option>博士</option></select></label>
      <label>拒绝线<input id="j-reject" type="number" value="60"></label>
    </div>
    <label>必备技能（逗号分隔）<input id="j-skills" value="Java, Spring"></label>
    <label>FAQ 知识库（每行一条，格式 键: 值）<textarea id="j-faq" rows="4">薪资范围: 20-30K，14薪，具体面议
远程政策: 全职远程，每季度一次线下团建
工时制度: 弹性工作制，双休</textarea></label>
    <label>话术风格<input id="j-style" value="专业、简洁、突出候选人亮点，不超过120字"></label>
    <div class="modal-actions">
      <button class="btn ghost" data-close>取消</button>
      <button class="btn primary" id="btn-create-job">创建职位</button>
    </div>
  </div>
</div>

<div id="modal-cand" class="modal hidden">
  <div class="modal-box wide">
    <h3 id="cand-title">候选人详情</h3>
    <div id="cand-body"></div>
    <div class="modal-actions"><button class="btn ghost" data-close>关闭</button></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
